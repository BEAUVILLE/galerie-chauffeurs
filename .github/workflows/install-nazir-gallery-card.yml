name: Install Nazir gallery card
on:
  push:
    paths:
      - '.github/workflows/install-nazir-gallery-card.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          loader='<script src="./nazir-gallery-card-v1.js?v=20260829-v1" defer></script>'
          if loader not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html: </body> absent')
              s=s.replace('</body>', loader+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit production patch and remove installer
        run: |
          rm -f .github/workflows/install-nazir-gallery-card.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/install-nazir-gallery-card.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'DRIVER gallery: show Nazir active card [skip ci]'
          git push origin main
