name: Nettoyage final adhérent WORLD8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctrine-adherent-world8-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nettoyer les dernières mentions ambassadeur
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gallery-world8.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            'DIGIY DRIVER DIGIYLYFE member driver':'DIGIYLYFE member driver',
            'Conductor embajador DIGIY DRIVER':'Conductor · Adherente DIGIYLYFE',
            'Motorista embaixador DIGIY DRIVER':'Motorista · Aderente DIGIYLYFE',
            'DIGIY DRIVER Botschafter-Fahrer':'Fahrer · DIGIYLYFE Mitglied',
            'Autista ambasciatore DIGIY DRIVER':'Autista · Aderente DIGIYLYFE',
            'DIGIY DRIVER ambassadeurchauffeur':'Chauffeur · DIGIYLYFE-lid',
            'سائق سفير DIGIY DRIVER':'سائق · عضو DIGIYLYFE',
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit et push
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/doctrine-adherent-world8-final.yml
          git add gallery-world8.js
          git commit -m 'Nettoyer les traductions adhérent DRIVER'
          git pull --rebase origin main
          git push
