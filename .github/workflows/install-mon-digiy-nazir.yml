name: Install MON DIGIY on Nazir Driver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mon-digiy-nazir.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject MON DIGIY favorite on Nazir
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nazir-driver.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="https://digiylyfe.com/assets/digiy-card-favorite-v1.js?v=20260904-v3"></script>'
          if 'digiy-card-favorite-v1.js' not in t:
              assert '</body>' in t
              t=t.replace('</body>', tag+'\n</body>', 1)
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add nazir-driver.html
          git commit -m "feat: add MON DIGIY favorite to Nazir Driver"
          git push
