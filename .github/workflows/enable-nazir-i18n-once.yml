name: Enable Nazir i18n once
on:
  push:
    paths:
      - '.github/workflows/enable-nazir-i18n-once.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          python3 -m py_compile scripts/enable-nazir-i18n-once.py
          node --check nazir-driver-i18n.js
      - name: Apply
        run: python3 scripts/enable-nazir-i18n-once.py
      - name: Validate result
        run: grep -q 'nazir-driver-i18n.js?v=20260828-i18n-v1' nazir-driver.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nazir-driver.html
          git commit -m 'Nazir Driver: activer les 8 langues'
          git push
