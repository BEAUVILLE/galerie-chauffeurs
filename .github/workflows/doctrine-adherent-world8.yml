name: Doctrine adhérent WORLD8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctrine-adherent-world8.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neutraliser les formulations dans les 8 langues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('gallery-world8.js')
          s=p.read_text(encoding='utf-8')

          updates={
            'fr':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'ADHÉRENTS DIGIYLYFE',
