            },
            'de':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'DIGIYLYFE MITGLIEDER',
              'brand_sub':'Eine Galerie für Senegal, Frankreich und die Diaspora mit sichtbaren und direkt erreichbaren Fahrern.',
              'intl_intro':'DIGIY DRIVER verbindet Senegal, Frankreich und die Diaspora für Transfers, Tourismus, direkten Kontakt und 0% Provision.',
              'intl_senegal_copy':'AIBD, Dakar, Saly, Mbour und Petite Côte: Der Kunde wählt einen sichtbaren und direkt erreichbaren Fahrer.',
              'panel_note':'Profile in der DIGIYLYFE-Galerie.',
              'section_title':'Den passenden Fahrer finden',
              'featured_sub':'Der erste verfügbare Fahrer erscheint hier. Öffnen Sie das DIGIYLYFE-Profil und kontaktieren Sie ihn direkt.',
              'cta_driver_title':'Sind Sie Fahrer?','cta_driver_sub':'Treten Sie DIGIY DRIVER bei und stärken Sie Ihre professionelle Präsenz.'
            },
            'it':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'ADERENTI DIGIYLYFE',
