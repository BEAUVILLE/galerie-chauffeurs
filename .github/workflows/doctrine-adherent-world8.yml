              'intl_intro':'DIGIY DRIVER relie le Sénégal, la France et la diaspora : accueil, transfert, tourisme, contact direct et 0% commission.',
              'intl_senegal_copy':'AIBD, Dakar, Saly, Mbour, Petite Côte : le client choisit un chauffeur visible et joignable directement.',
              'panel_note':'Profils présents dans la vitrine DIGIYLYFE.',
              'section_title':'Trouver le bon chauffeur',
              'featured_sub':'Le premier chauffeur disponible apparaît ici. Ouvrez sa fiche DIGIYLYFE puis contactez-le directement.',
              'cta_driver_title':'Vous êtes chauffeur ?','cta_driver_sub':'Rejoignez DIGIY DRIVER et développez votre présence professionnelle.'
