              'intl_intro':'DIGIY DRIVER collega Senegal, Francia e diaspora per trasferimenti, turismo, contatto diretto e 0% commissioni.',
              'intl_senegal_copy':'AIBD, Dakar, Saly, Mbour e Petite Côte: il cliente sceglie un autista visibile e contattabile direttamente.',
              'panel_note':'Profili presenti nella vetrina DIGIYLYFE.',
              'section_title':'Trova l’autista giusto',
              'featured_sub':'Il primo autista disponibile appare qui. Apri la scheda DIGIYLYFE e contattalo direttamente.',
              'cta_driver_title':'Sei un autista?','cta_driver_sub':'Entra in DIGIY DRIVER e sviluppa la tua presenza professionale.'
            },
            'nl':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'DIGIYLYFE-LEDEN',
              'brand_sub':'Een galerij die Senegal, Frankrijk en de diaspora verbindt met zichtbare en rechtstreeks bereikbare chauffeurs.',
              'intl_intro':'DIGIY DRIVER verbindt Senegal, Frankrijk en de diaspora voor transfers, toerisme, direct contact en 0% commissie.',
              'intl_senegal_copy':'AIBD, Dakar, Saly, Mbour en Petite Côte: de klant kiest een zichtbare en rechtstreeks bereikbare chauffeur.',
              'panel_note':'Profielen in de DIGIYLYFE-galerij.',
              'section_title':'Vind de juiste chauffeur',
              'featured_sub':'De eerste beschikbare chauffeur verschijnt hier. Open het DIGIYLYFE-profiel en neem rechtstreeks contact op.',
              'cta_driver_title':'Bent u chauffeur?','cta_driver_sub':'Sluit u aan bij DIGIY DRIVER en bouw uw professionele aanwezigheid uit.'
            },
            'ar':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'أعضاء DIGIYLYFE',
              'brand_sub':'واجهة تربط السنغال وفرنسا والشتات بسائقين ظاهرين ويمكن التواصل معهم مباشرة.',
              'intl_intro':'يربط DIGIY DRIVER السنغال وفرنسا والشتات لخدمات النقل والسياحة والتواصل المباشر وعمولة 0%.',
              'intl_senegal_copy':'AIBD وداكار وسالي ومبور والساحل الصغير: يختار العميل سائقا ظاهرا ويمكن التواصل معه مباشرة.',
              'panel_note':'ملفات موجودة في واجهة DIGIYLYFE.',
              'section_title':'العثور على السائق المناسب',
              'featured_sub':'يظهر هنا أول سائق متاح. افتح ملف DIGIYLYFE وتواصل معه مباشرة.',
