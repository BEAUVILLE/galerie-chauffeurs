              'panel_note':'Profiles listed in the DIGIYLYFE gallery.',
              'section_title':'Find the right driver',
              'featured_sub':'The first available driver appears here. Open the DIGIYLYFE profile and contact the driver directly.',
              'cta_driver_title':'Are you a driver?','cta_driver_sub':'Join DIGIY DRIVER and grow your professional presence.'
            },
            'es':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'ADHERENTES DIGIYLYFE',
              'brand_sub':'Una galería que conecta Senegal, Francia y la diáspora con conductores visibles y contactables directamente.',
              'intl_intro':'DIGIY DRIVER conecta Senegal, Francia y la diáspora para traslados, turismo, contacto directo y 0% comisión.',
              'intl_senegal_copy':'AIBD, Dakar, Saly, Mbour y Petite Côte: el cliente elige un conductor visible y contactable directamente.',
              'panel_note':'Perfiles presentes en la vitrina DIGIYLYFE.',
              'section_title':'Encontrar el conductor adecuado',
              'featured_sub':'El primer conductor disponible aparece aquí. Abre su ficha DIGIYLYFE y contáctalo directamente.',
              'cta_driver_title':'¿Eres conductor?','cta_driver_sub':'Únete a DIGIY DRIVER y desarrolla tu presencia profesional.'
            },
            'pt':{
              'eyebrow':'DIGIY DRIVER','hero_title':'DIGIY DRIVER','pill_class':'ADERENTES DIGIYLYFE',
              'brand_sub':'Uma galeria que liga Senegal, França e diáspora a motoristas visíveis e contactáveis diretamente.',
              'intl_intro':'DIGIY DRIVER liga Senegal, França e diáspora para transferes, turismo, contacto direto e 0% comissão.',
              'intl_senegal_copy':'AIBD, Dakar, Saly, Mbour e Petite Côte: o cliente escolhe um motorista visível e contactável diretamente.',
