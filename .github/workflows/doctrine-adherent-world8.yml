          }

          order=['fr','en','es','pt','de','it','nl','ar']
          for i,lang in enumerate(order):
              start=s.find(f'    {lang}:{{')
              if start<0:
                  continue
              if i+1<len(order):
                  end=s.find(f'    {order[i+1]}:{{',start)
              else:
                  end=s.find('\n  };',start)
              if end<0: end=len(s)
              block=s[start:end]
              for key,val in updates[lang].items():
                  val=val.replace('\\','\\\\').replace("'","\\'")
                  pat=rf"({re.escape(key)}:)'(?:\\.|[^'])*'"
                  block,n=re.subn(pat,lambda m:m.group(1)+"'"+val+"'",block,count=1)
                  if n==0:
                      print('WARN',lang,key)
              s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')

          # Nettoyage des chaînes FR statiques et des messages préremplis.
          q=Path('index.html')
          x=q.read_text(encoding='utf-8')
          for a,b in [
              ('chauffeurs visibles, sérieux et joignables','chauffeurs visibles et joignables directement'),
              ('chauffeur sérieux, contact direct','contact direct'),
              ('DIGIY%20DRIVER%20AMBASSADEUR','DIGIY%20DRIVER'),
              ('DIGIY DRIVER AMBASSADEUR','DIGIY DRIVER'),
          ]:
              x=x.replace(a,b)
          q.write_text(x,encoding='utf-8')
          PY
      - name: Commit et push
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/doctrine-adherent-world8.yml
          git add index.html gallery-world8.js
          git commit -m 'Doctrine adhérent DRIVER en 8 langues'
          git pull --rebase origin main
          git push
