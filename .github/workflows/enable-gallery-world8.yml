name: Enable gallery WORLD8
on:
  push:
    paths:
      - '.github/workflows/enable-gallery-world8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject WORLD8 loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="./gallery-world8.js?v=20260812-world8-v1" defer></script>'
          if marker in s:
              print('WORLD8 loader already present')
          else:
              if '</body>' not in s:
                  raise SystemExit('Missing </body>')
              s=s.replace('</body>', marker+'\n</body>', 1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F 'gallery-world8.js?v=20260812-world8-v1' index.html
      - name: Commit
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Activer 8 langues sur la galerie chauffeurs'
          git push
