name: Optimiser Nazir Driver sans conversion

on:
  push:
    paths:
      - '.github/workflows/optimiser-nazir-lite-temp.yml'

permissions:
  contents: write

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimiser chargement Nazir
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('nazir-driver.html')
          s=p.read_text(encoding='utf-8')
          old='<img src="nazir-driver-card.svg" alt="Carte professionnelle de Nazir Driver avec QR WhatsApp direct" width="1080" height="1920">'
          new='<img src="nazir-driver-card.svg" alt="Carte professionnelle de Nazir Driver avec QR WhatsApp direct" width="1080" height="1920" decoding="async">'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Image fiche Nazir introuvable')

          p=Path('nazir-gallery-card-v1.js')
          s=p.read_text(encoding='utf-8')
          old='<img src="https://galerie-chauffeurs.digiylyfe.com/nazir-driver-card.svg" alt="Nazir Driver">'
          new='<img src="https://galerie-chauffeurs.digiylyfe.com/nazir-driver-card.svg" alt="Nazir Driver" loading="lazy" decoding="async" fetchpriority="low">'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Image galerie Nazir introuvable')
          PY

      - name: Verifier le poids du SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('nazir-driver-card.svg')
          print(f'nazir SVG={f.stat().st_size} bytes')
          PY

      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/optimiser-nazir-lite-temp.yml
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add nazir-driver.html nazir-gallery-card-v1.js .github/workflows/optimiser-nazir-lite-temp.yml
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: finaliser chargement leger Nazir Driver'
          git push
